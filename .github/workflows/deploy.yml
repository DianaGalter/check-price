name: Deploy to GitHub Pages

on:
  push:
    branches: ["master", "dev"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install master dependencies
        run: pnpm install --frozen-lockfile

      - name: Build master
        run: pnpm build
        env:
          DEPLOY_PATH: /check-price/

      - name: Save production build
        run: |
          mkdir -p /tmp/site
          cp -r dist/. /tmp/site/

      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          clean: true

      - name: Install dev dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dev
        run: pnpm build
        env:
          DEPLOY_PATH: /check-price/dev/

      - name: Add dev build
        run: |
          mkdir -p /tmp/site/dev
          cp -r dist/. /tmp/site/dev/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4